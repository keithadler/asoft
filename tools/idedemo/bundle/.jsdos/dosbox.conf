# The windowed front end. machine=svga_s3 gives a VGA text mode, so the 8x8
# font yields 50 rows; the layout uses the top 43 and leaves the rest blank.
[sdl]
# so the browser pointer drives the menus without being captured
autolock=false

[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=normal
cputype=auto
cycles=20000
[mixer]
nosound=true
[autoexec]
mount c .
c:
ASOFTIDE.EXE TESTS.BAS
