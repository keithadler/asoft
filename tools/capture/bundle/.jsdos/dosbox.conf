# Non-interactive capture rig: pipe SCRIPT.TXT through the interpreter and
# leave the transcript in OUT.TXT for ci.fsReadFile() to pick up.
[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=auto
cputype=auto
cycles=20000
[mixer]
nosound=true
[autoexec]
mount c .
c:
ASOFT.EXE < SCRIPT.TXT > OUT.TXT
echo CAPTURE-DONE > DONE.TXT
