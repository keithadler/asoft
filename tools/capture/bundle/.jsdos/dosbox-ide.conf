# Non-interactive capture rig: pipe SCRIPT.TXT through the interpreter and
# leave the transcript in OUT.TXT for ci.fsReadFile() to pick up.
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=auto
cputype=auto
cycles=20000
[mixer]
nosound=true
[autoexec]
mount c .
c:
ASOFTIDE.EXE -dump OUT.TXT TESTS.BAS
echo done > DONE.TXT
