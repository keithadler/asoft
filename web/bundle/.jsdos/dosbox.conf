# js-dos / DOSBox configuration for Applesoft BASIC for DOS.
# Text-mode Turbo Vision app: no need for cycles=max, and machine=svga_s3
# gives a clean 80x43 8x8 font.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=auto
cputype=auto
cycles=20000

[render]
aspect=true
scaler=none

[mixer]
nosound=true

[autoexec]
mount c .
c:
ASOFT.EXE
