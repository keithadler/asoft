# js-dos / DOSBox configuration for Applesoft BASIC for DOS.
# cycles=200000 lets the compute-bound demos (Mandelbrot, the dragon curve)
# finish in seconds now that they run flat out; the games pace themselves
# off the DOS clock, so they are unaffected.

[sdl]
autolock=false

[dosbox]
machine=vgaonly
memsize=16

[cpu]
core=normal
cputype=auto
cycles=200000

[render]
aspect=false
scaler=none

[mixer]
# The PC speaker is the Apple's speaker: PEEK(-16336) clicks it.
nosound=false

[autoexec]
mount c .
c:
ASOFT.EXE
