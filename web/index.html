<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applesoft BASIC for DOS</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #111; }
  #dos { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="dos"></div>
<script>
  Dos(document.getElementById("dos"), {
    url: "asoft.jsdos",
    // 80x43 text mode wants a tall aspect; let the canvas fill the frame
    renderAspect: "4/3",
    autoStart: true,
    kiosk: true
  });
</script>
</body>
</html>
