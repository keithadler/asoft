<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applesoft BASIC — IDE</title>
<link rel="stylesheet" href="vendor/jsdos/js-dos.css">
<script src="vendor/jsdos/js-dos.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0c0c0e; color: #c5c5c5;
               font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  #dos { flex: 1 1 auto; min-height: 0; }
  footer { flex: none; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
           padding: 8px 16px; background: #141417; border-top: 1px solid #26262c;
           color: #8a8a92; font-size: 12.5px; }
  a { color: #7ddc7d; text-decoration: none; }
  a:hover { text-decoration: underline; }
  kbd { background: #1a1a1f; border: 1px solid #2b2b33; border-radius: 4px;
        padding: 0 5px; color: #7ddc7d; font: inherit; }
</style>
</head>
<body>
<div id="dos"></div>
<footer>
  <a href="./">&larr; home</a>
  <span><kbd>F10</kbd> menus</span>
  <span><kbd>F5</kbd> run</span>
  <span><kbd>F9</kbd> list</span>
  <span>Samples menu loads any demo</span>
  <span>Click the screen first so it takes the keyboard</span>
  <a href="console.html" style="margin-left:auto">plain console &rarr;</a>
</footer>
<script>
Dos(document.getElementById("dos"), {
  pathPrefix: "vendor/jsdos/emulators/",
  url: "idedemo.jsdos?v=e0080efce791",
  autoStart: true,
  kiosk: true,
  onEvent: (e, arg) => { if (e === "ci-ready") window.__ci = arg; },
});
</script>
</body>
</html>
